<section id="demos" class="app invisible">
    <aside class="brand">
        <img class="brand-logo" src="assets/kyndryl_logo.png" alt="Kyndryl">
        <!-- buttons drop focus after a click, so the menu's Enter shortcut can't press them again -->
        <div class="controls">
            <button id="webcamButton" class="control-button primary" (click)="enableCam($event); $any($event.currentTarget).blur()">{{text(webcamRunning ? 'disableWebcam' : 'enableWebcam')}}</button>
            <button class="control-button" (click)="setDrawJoints(); $any($event.currentTarget).blur()">{{text(drawJoints ? 'hideJoints' : 'showJoints')}}</button>
            <button class="control-button" (click)="toggleFullscreen(); $any($event.currentTarget).blur()">{{text(isFullscreen ? 'exitFullscreen' : 'fullscreen')}}</button>
        </div>
    </aside>

    <main class="stage" #stage>
        <!-- the game world is always 960x720; it is scaled with CSS to fill the stage -->
        <div id="container" [style.transform]="'scale(' + stageScale + ')'">
            <video id="webcam" autoplay playsinline></video>
            <canvas class="base_canvas" id="base_canvas"></canvas>
            <canvas class="top_canvas" id="top_canvas"></canvas>
        </div>
    </main>
</section>
