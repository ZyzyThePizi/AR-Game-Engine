<section id="demos" class="app invisible">
    <aside class="brand">
        <img class="brand-logo" src="assets/kyndryl_logo.png" alt="Kyndryl">
        <!-- buttons drop focus after a click, so the menu's Enter shortcut can't press them again -->
        <div class="controls">
            <button id="webcamButton" class="control-button primary" (click)="enableCam($event); $any($event.currentTarget).blur()">ENABLE WEBCAM</button>
            <button class="control-button" (click)="setDrawJoints(); $any($event.currentTarget).blur()">{{drawJoints ? 'Clear joints' : 'Show joints'}}</button>
            <button class="control-button" (click)="toggleFullscreen(); $any($event.currentTarget).blur()">{{isFullscreen ? 'Exit fullscreen' : 'Fullscreen'}}</button>
        </div>
    </aside>

    <main class="stage" #stage>
        <!-- the game world is always 960x720; it is scaled with CSS to fill the stage -->
        <div id="container" [style.transform]="'scale(' + stageScale + ')'">
            <video id="webcam" autoplay playsinline></video>
            <canvas class="base_canvas" id="base_canvas"></canvas>
            <canvas class="top_canvas" id="top_canvas"></canvas>
        </div>
    </main>
</section>
